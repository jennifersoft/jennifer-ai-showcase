<!-- 새 덱 시작 템플릿. 이 폴더를 slides/<덱이름>/ 으로 복사해서 고친다.
     - 한 장 = <section class="slide">. data-notes 는 진행 메모(대본 페이지에서 본다).
     - data-presenter 는 짧은 발표자 대본. 빈 줄로 통역을 기다릴 구간을 나눈다.
     - data-script 는 통역 준비용 상세 원고. data-presenter 가 없으면 이 원고를 대신 보여 준다.
     - data-a 를 붙인 요소는 등장 애니메이션, style="--d:2" 로 순서를 늦춘다.
     - data-steps="N" + deck.js 의 hooks['<id>'] 로 단계 연출을 만든다.
     - {{live:jennifer}} / {{live:/widgets/pagerduty}} 로 실제 화면을 iframe으로 넣는다. -->

<section class="slide" id="cover" data-notes="표지">
  <canvas id="net" style="position:absolute;inset:0"></canvas>
  <div class="spacer"></div>
  <p class="eyebrow" data-a>JENNIFER</p>
  <h1 data-a style="--d:1">제목을 쓰세요</h1>
  <p class="kr" data-a style="--d:2">부제목</p>
  <div class="spacer"></div>
</section>

<section class="slide sec" data-notes="섹션 구분">
  <p class="num" data-a="left">01</p>
  <h2 data-a style="--d:1">섹션 제목</h2>
</section>

<section class="slide" data-notes="본문 + 숫자 카드">
  <div>
    <p class="eyebrow" data-a>Topic</p>
    <h2 data-a style="--d:1">핵심 메시지 한 줄</h2>
    <p class="kr s" data-a style="--d:1">보조 설명</p>
  </div>
  <div class="stats">
    <div class="stat" data-a style="--d:2"><b>123</b><span>지표 이름</span></div>
    <div class="stat" data-a style="--d:3"><b>45%</b><span>지표 이름</span></div>
    <div class="stat" data-a style="--d:4"><b>6x</b><span>지표 이름</span></div>
  </div>
</section>

<section class="slide" data-notes="대시보드 목업: canvas data-chart 는 축이 있는 움직이는 차트(line·bars·xview·heat). data-max 로 Y축 최대값, data-unit 으로 단위">
  <div>
    <p class="eyebrow" data-a>Dashboard</p>
    <h2 data-a style="--d:1;font-size:64px">차트로 보여주기</h2>
  </div>
  <div class="dash" data-a style="--d:2">
    <div class="tile"><span class="t">TPS</span><canvas data-chart="line" data-c="#1C78D4" data-max="200"></canvas></div>
    <div class="tile"><span class="t">Response Time</span><canvas data-chart="line" data-c="#0F9F68" data-max="2000" data-unit="ms"></canvas></div>
    <div class="tile"><span class="t">Active Service</span><canvas data-chart="bars" data-max="50"></canvas></div>
    <div class="tile" style="grid-column:span 2"><span class="t">X-View</span><canvas data-chart="xview"></canvas></div>
    <div class="tile"><span class="t">Heatmap</span><canvas data-chart="heat"></canvas></div>
  </div>
</section>

<section class="slide" data-notes="[라이브] 실제 화면">
  <div>
    <p class="eyebrow" data-a>Live</p>
    <h2 data-a style="--d:1;font-size:56px">실제 화면</h2>
  </div>
  <div class="live" data-a style="--d:2">{{live:/widgets/pagerduty}}</div>
</section>

<section class="slide" id="closing" data-notes="마무리">
  <div class="spacer"></div>
  <h1 data-a style="font-size:112px">감사합니다</h1>
  <div class="spacer"></div>
</section>
